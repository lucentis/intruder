# JVM settings used by the Gradle build process.
# The JVM is the Java Virtual Machine that runs Gradle.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Allows Gradle to execute independent tasks in parallel.
# This can speed up builds, especially in multi-module projects.
org.gradle.parallel=true

# Enables AndroidX libraries.
# AndroidX is the modern replacement for the original Android Support Library.
android.useAndroidX=true
