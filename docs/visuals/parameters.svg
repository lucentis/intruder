
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>Intruder — Paramètres</title>
  <defs>
    <clipPath id="screen">
      <rect width="390" height="844" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="390" height="844" fill="#F8FAFC"/>

    <!-- Titre -->
    <text x="18" y="57"
      font-family="Arial, sans-serif"
      font-size="23"
      font-weight="700"
      fill="#27272A">Paramètres</text>

    <line x1="18" y1="77" x2="372" y2="77" stroke="#E2E8F0"/>

    <!-- PROTECTION -->
    <text x="18" y="105"
      font-family="Arial, sans-serif"
      font-size="14"
      font-weight="700"
      fill="#27272A">Protection</text>

    <rect x="18" y="116" width="354" height="181" rx="16" fill="#FFFFFF"/>

    <!-- Protection globale -->
    <rect x="30" y="130" width="38" height="38" rx="9" fill="#F1F5F9"/>
    <g transform="translate(49 149)" fill="none" stroke="#475569"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -11 L9 -7 V0 C9 6 4 10 0 12 C-4 10 -9 6 -9 0 V-7 Z"/>
      <path d="M-4 0 L-1 3 L5 -4"/>
    </g>
    <text x="80" y="145" font-family="Arial" font-size="13"
      font-weight="600" fill="#27272A">Protection globale</text>
    <text x="80" y="161" font-family="Arial" font-size="11"
      fill="#71717A">Activer ou désactiver la protection</text>
    <rect x="277" y="138" width="64" height="23" rx="12" fill="#E0EEE4"/>
    <text x="309" y="153.5" text-anchor="middle" font-family="Arial"
      font-size="10" font-weight="600" fill="#34764F">Activée</text>
    <path d="M350 145 L355 149 L350 153" fill="none"
      stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round"/>

    <line x1="30" y1="180" x2="360" y2="180" stroke="#E2E8F0"/>

    <!-- Surveillance -->
    <rect x="30" y="191" width="38" height="38" rx="9" fill="#F1F5F9"/>
    <g transform="translate(49 210)" fill="none" stroke="#475569"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-12 0 Q0 -12 12 0 Q0 12 -12 0 Z"/>
      <circle cx="0" cy="0" r="3.5"/>
    </g>
    <text x="80" y="206" font-family="Arial" font-size="13"
      font-weight="600" fill="#27272A">Surveillance</text>
    <text x="80" y="222" font-family="Arial" font-size="11"
      fill="#71717A">Déverrouillages réussis et codes PIN échoués</text>
    <path d="M350 206 L355 210 L350 214" fill="none"
      stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round"/>

    <line x1="30" y1="239" x2="360" y2="239" stroke="#E2E8F0"/>

    <!-- Capture photo -->
    <rect x="30" y="249" width="38" height="38" rx="9" fill="#F1F5F9"/>
    <g transform="translate(49 268)" fill="none" stroke="#475569"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-11 -6 H-5 L-2 -10 H4 L7 -6 H11 V8 H-11 Z"/>
      <circle cx="0" cy="1" r="4"/>
    </g>
    <text x="80" y="264" font-family="Arial" font-size="13"
      font-weight="600" fill="#27272A">Capture photo</text>
    <text x="80" y="280" font-family="Arial" font-size="11"
      fill="#71717A">Photos automatiques</text>
    <path d="M350 264 L355 268 L350 272" fill="none"
      stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- NOTIFICATIONS -->
    <text x="18" y="329" font-family="Arial" font-size="14"
      font-weight="700" fill="#27272A">Notifications</text>

    <rect x="18" y="340" width="354" height="65" rx="16" fill="#FFFFFF"/>
    <rect x="30" y="353" width="38" height="38" rx="9" fill="#F1F5F9"/>
    <g transform="translate(49 372)" fill="none" stroke="#475569"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-9 5 H9 L6 1 V-4 C6 -9 -6 -9 -6 -4 V1 Z"/>
      <path d="M-3 9 Q0 12 3 9"/>
    </g>
    <text x="80" y="367" font-family="Arial" font-size="13"
      font-weight="600" fill="#27272A">Notifications techniques</text>
    <text x="80" y="383" font-family="Arial" font-size="11"
      fill="#71717A">Alertes et autorisations Android</text>
    <path d="M350 367 L355 372 L350 376" fill="none"
      stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- STOCKAGE -->
    <text x="18" y="437" font-family="Arial" font-size="14"
      font-weight="700" fill="#27272A">Stockage</text>

    <rect x="18" y="448" width="354" height="65" rx="16" fill="#FFFFFF"/>
    <rect x="30" y="461" width="38" height="38" rx="9" fill="#F1F5F9"/>
    <g transform="translate(49 480)" fill="none" stroke="#475569"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="0" cy="-7" rx="9" ry="4"/>
      <path d="M-9 -7 V7 C-9 12 9 12 9 7 V-7"/>
      <path d="M-9 0 C-9 5 9 5 9 0"/>
    </g>
    <text x="80" y="475" font-family="Arial" font-size="13"
      font-weight="600" fill="#27272A">Stockage local</text>
    <text x="80" y="491" font-family="Arial" font-size="11"
      fill="#71717A">Espace utilisé et événements enregistrés</text>
    <path d="M350 475 L355 480 L350 484" fill="none"
      stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- À PROPOS -->
    <text x="18" y="545" font-family="Arial" font-size="14"
      font-weight="700" fill="#27272A">À propos</text>

    <rect x="18" y="556" width="354" height="65" rx="16" fill="#FFFFFF"/>
    <rect x="30" y="569" width="38" height="38" rx="9" fill="#F1F5F9"/>
    <g transform="translate(49 588)" fill="none" stroke="#475569"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="10"/>
      <path d="M0 -1 V5 M0 -6 V-5"/>
    </g>
    <text x="80" y="583" font-family="Arial" font-size="13"
      font-weight="600" fill="#27272A">Intruder</text>
    <text x="80" y="599" font-family="Arial" font-size="11"
      fill="#71717A">Version et informations légales</text>
    <path d="M350 583 L355 588 L350 592" fill="none"
      stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Navigation inférieure -->
    <rect x="0" y="768" width="390" height="76" fill="#FFFFFF"/>
    <line x1="0" y1="768" x2="390" y2="768" stroke="#E2E8F0"/>

    <!-- Galerie inactive -->
    <g transform="translate(112 790)" fill="none" stroke="#77777A"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-7" width="16" height="14" rx="2"/>
      <circle cx="0" cy="0" r="2.5"/>
    </g>
    <text x="112" y="814" text-anchor="middle" font-family="Arial"
      font-size="11" fill="#77777A">Galerie</text>

    <!-- Paramètres actif -->
    <g transform="translate(278 790)" fill="none" stroke="#64748B"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle r="3"/>
      <path d="M0 -9 V-6 M0 6 V9 M-9 0 H-6 M6 0 H9
        M-6.5 -6.5 L-4.5 -4.5 M4.5 4.5 L6.5 6.5
        M6.5 -6.5 L4.5 -4.5 M-4.5 4.5 L-6.5 6.5"/>
    </g>
    <text x="278" y="814" text-anchor="middle" font-family="Arial"
      font-size="11" font-weight="600" fill="#64748B">Paramètres</text>
  </g>
</svg>
