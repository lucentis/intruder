  <rect x="20" y="301" width="350" height="119" rx="16" fill="#FFFFFF"/>
  <text x="40" y="331" font-family="Arial" font-size="14" font-weight="600" fill="#27272A">Informations</text>
  <text x="40" y="365" font-family="Arial" font-size="12" fill="#71717A">Application</text>
  <text x="350" y="365" text-anchor="end" font-family="Arial" font-size="12" font-weight="500" fill="#27272A">Intruder</text>
  <line x1="40" y1="380" x2="350" y2="380" stroke="#E2E8F0"/>
  <text x="40" y="403" font-family="Arial" font-size="12" fill="#71717A">Version</text>
  <text x="350" y="403" text-anchor="end" font-family="Arial" font-size="12" font-weight="500" fill="#27272A">1.0.0</text>

  <!-- Legal information -->
  <rect x="20" y="440" width="350" height="181" rx="16" fill="#FFFFFF"/>
  <text x="40" y="470" font-family="Arial" font-size="14" font-weight="600" fill="#27272A">Informations légales</text>

  <text x="40" y="510" font-family="Arial" font-size="12" fill="#27272A">Politique de confidentialité</text>
  <path d="M342 504 L347 509 L342 514" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="40" y1="529" x2="350" y2="529" stroke="#E2E8F0"/>

  <text x="40" y="559" font-family="Arial" font-size="12" fill="#27272A">Mentions légales</text>
  <path d="M342 553 L347 558 L342 563" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="40" y1="578" x2="350" y2="578" stroke="#E2E8F0"/>

  <text x="40" y="608" font-family="Arial" font-size="12" fill="#27272A">Licences open source</text>
  <path d="M342 602 L347 607 L342 612" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom navigation -->
  <line x1="0" y1="768" x2="390" y2="768" stroke="#E2E8F0"/>

