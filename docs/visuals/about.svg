    <path d="M31 49 L23 57 L31 65"/>
    <path d="M24 57 H39"/>
  </g>
  <text x="52" y="63" font-family="Arial" font-size="20" font-weight="600" fill="#27272A">À propos</text>

  <!-- App identity -->
  <rect x="20" y="91" width="350" height="190" rx="16" fill="#FFFFFF"/>
  <rect x="151" y="111" width="68" height="68" rx="18" fill="#E0EEE4"/>
  <g transform="translate(185 145)" fill="none" stroke="#34764F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -19 L17 -12 V0 C17 12 8 20 0 24 C-8 20 -17 12 -17 0 V-12 Z"/>
  </g>
  <text x="195" y="211" text-anchor="middle" font-family="Arial" font-size="21" font-weight="600" fill="#27272A">Intruder</text>
  <text x="195" y="231" text-anchor="middle" font-family="Arial" font-size="11" fill="#71717A">Protection et surveillance du téléphone</text>
  <rect x="157" y="245" width="76" height="22" rx="11" fill="#E0EEE4"/>
  <text x="195" y="260" text-anchor="middle" font-family="Arial" font-size="10" font-weight="600" fill="#34764F">Version 1.0.0</text>

