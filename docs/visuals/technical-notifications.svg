
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#F8FAFC"/>

  <defs>
    <clipPath id="screen">
      <rect width="390" height="844" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <!-- Header -->
    <g fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31 49 L23 57 L31 65"/>
      <path d="M24 57 H39"/>
    </g>
    <text x="52" y="63" font-family="Arial" font-size="20" font-weight="600" fill="#27272A">Notifications techniques</text>

    <!-- Main card -->
    <rect x="20" y="91" width="350" height="400" rx="16" fill="#FFFFFF"/>
    <text x="40" y="125" font-family="Arial" font-size="15" font-weight="600" fill="#27272A">Types de notifications</text>

    <!-- Protection interrupted -->
    <rect x="40" y="145" width="40" height="40" rx="10" fill="#F1F5F9"/>
    <g transform="translate(60 165)" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -10 L9 -6 V0 C9 6 4 10 0 12 C-4 10 -9 6 -9 0 V-6 Z"/>
      <path d="M0 -4 V2"/>
      <circle cx="0" cy="6" r=".7" fill="#64748B" stroke="none"/>
    </g>
    <text x="92" y="159" font-family="Arial" font-size="13" font-weight="600" fill="#27272A">Protection interrompue</text>
    <text x="92" y="176" font-family="Arial" font-size="10.5" fill="#71717A">Signaler lorsque le service de</text>
    <text x="92" y="190" font-family="Arial" font-size="10.5" fill="#71717A">protection s'arrête.</text>
    <rect x="312" y="153" width="42" height="24" rx="12" fill="#64748B"/>
    <circle cx="342" cy="165" r="8" fill="#FFFFFF"/>

    <line x1="40" y1="210" x2="350" y2="210" stroke="#E2E8F0"/>

    <!-- Missing permission -->
    <rect x="40" y="228" width="40" height="40" rx="10" fill="#F1F5F9"/>
    <g transform="translate(60 248)" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-3" cy="-3" r="6"/>
      <path d="M1 1 L9 9 M5 5 L8 2 M7 7 L10 4"/>
    </g>
    <text x="92" y="242" font-family="Arial" font-size="13" font-weight="600" fill="#27272A">Autorisation manquante</text>
    <text x="92" y="259" font-family="Arial" font-size="10.5" fill="#71717A">Signaler lorsqu'une autorisation</text>
    <text x="92" y="273" font-family="Arial" font-size="10.5" fill="#71717A">nécessaire n'est plus disponible.</text>
    <rect x="312" y="236" width="42" height="24" rx="12" fill="#64748B"/>
    <circle cx="342" cy="248" r="8" fill="#FFFFFF"/>

    <line x1="40" y1="293" x2="350" y2="293" stroke="#E2E8F0"/>

    <!-- Capture problem -->
    <rect x="40" y="311" width="40" height="40" rx="10" fill="#F1F5F9"/>
    <g transform="translate(60 331)" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10 -5 H-5 L-2 -9 H4 L7 -5 H10 V7 H-10 Z"/>
      <circle cx="0" cy="1" r="3.5"/>
      <path d="M-9 -9 L9 9"/>
    </g>
    <text x="92" y="325" font-family="Arial" font-size="13" font-weight="600" fill="#27272A">Problème de capture</text>
    <text x="92" y="342" font-family="Arial" font-size="10.5" fill="#71717A">Signaler lorsqu'une photo n'a pas</text>
    <text x="92" y="356" font-family="Arial" font-size="10.5" fill="#71717A">pu être capturée ou enregistrée.</text>
    <rect x="312" y="319" width="42" height="24" rx="12" fill="#64748B"/>
    <circle cx="342" cy="331" r="8" fill="#FFFFFF"/>

    <!-- Card bottom spacing -->
    <text x="40" y="455" font-family="Arial" font-size="10" fill="#71717A">Chaque réglage est indépendant.</text>

    <!-- Information card -->
    <rect x="20" y="511" width="350" height="91" rx="16" fill="#FFFFFF"/>
    <g transform="translate(42 538)" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round">
      <circle r="8"/>
      <path d="M0 -3 V0 M0 3 V3.5"/>
    </g>
    <text x="59" y="542" font-family="Arial" font-size="13" font-weight="600" fill="#27272A">À savoir</text>
    <text x="40" y="568" font-family="Arial" font-size="11" fill="#71717A">Chaque type de notification peut être activé</text>
    <text x="40" y="584" font-family="Arial" font-size="11" fill="#71717A">ou désactivé indépendamment.</text>

    <!-- Bottom navigation -->
    <rect x="0" y="768" width="390" height="76" fill="#FFFFFF"/>
    <line x1="0" y1="768" x2="390" y2="768" stroke="#E2E8F0"/>

    <!-- Galerie -->
    <g transform="translate(112 790)" fill="none" stroke="#77777A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-7" width="16" height="14" rx="2"/>
      <circle cx="0" cy="0" r="2.5"/>
    </g>
    <text x="112" y="814" text-anchor="middle" font-family="Arial" font-size="11" fill="#77777A">Galerie</text>

    <!-- Paramètres -->
    <g transform="translate(278 790)" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round">
      <circle r="3"/>
      <path d="M0 -9 V-6 M0 6 V9 M-9 0 H-6 M6 0 H9 M-6.5 -6.5 L-4.5 -4.5 M4.5 4.5 L6.5 6.5 M6.5 -6.5 L4.5 -4.5 M-4.5 4.5 L-6.5 6.5"/>
    </g>
    <text x="278" y="814" text-anchor="middle" font-family="Arial" font-size="11" font-weight="600" fill="#64748B">Paramètres</text>
  </g>
</svg>
