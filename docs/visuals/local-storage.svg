
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>Intruder — Stockage local</title>
  <defs>
    <clipPath id="screen">
      <rect width="390" height="844" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="390" height="844" fill="#F8FAFC"/>

    <!-- Header -->
    <g fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31 49 L23 57 L31 65"/>
      <path d="M24 57 H39"/>
    </g>
    <text x="52" y="63" font-family="Arial" font-size="20" font-weight="600" fill="#27272A">Stockage local</text>

    <!-- Main card -->
    <rect x="20" y="91" width="350" height="303" rx="16" fill="#FFFFFF"/>

    <!-- Storage icon -->
    <rect x="40" y="111" width="42" height="42" rx="10" fill="#F1F5F9"/>
    <g transform="translate(61 132)" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-10" y="-8" width="20" height="16" rx="2"/>
      <path d="M-6 -3 H6 M-6 1 H6 M-6 5 H0"/>
    </g>
    <text x="94" y="127" font-family="Arial" font-size="13" font-weight="600" fill="#27272A">Stockage des photos</text>
    <text x="94" y="144" font-family="Arial" font-size="10.5" fill="#71717A">Les photos sont conservées localement</text>
    <text x="94" y="158" font-family="Arial" font-size="10.5" fill="#71717A">sur cet appareil.</text>

    <line x1="40" y1="176" x2="350" y2="176" stroke="#E2E8F0"/>

    <!-- Used space -->
    <text x="40" y="204" font-family="Arial" font-size="13" font-weight="600" fill="#27272A">Espace utilisé</text>
    <text x="350" y="207" text-anchor="end" font-family="Arial" font-size="21" font-weight="600" fill="#27272A">128 Mo</text>
    <rect x="40" y="224" width="310" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="40" y="224" width="99" height="8" rx="4" fill="#64748B"/>
    <text x="40" y="250" font-family="Arial" font-size="10.5" fill="#71717A">Espace occupé par les données d'Intruder.</text>

    <line x1="40" y1="272" x2="350" y2="272" stroke="#E2E8F0"/>

    <!-- Private storage -->
    <g transform="translate(54 318)" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-1" width="16" height="13" rx="2"/>
      <path d="M-5 -1 V-5 A5 5 0 0 1 5 -5 V-1"/>
    </g>
    <text x="78" y="312" font-family="Arial" font-size="13" font-weight="600" fill="#27272A">Stockage privé</text>
    <text x="78" y="330" font-family="Arial" font-size="10.5" fill="#71717A">Les photos sont conservées dans l'espace</text>
    <text x="78" y="344" font-family="Arial" font-size="10.5" fill="#71717A">privé de l'application.</text>

    <!-- Information card -->
    <rect x="20" y="414" width="350" height="91" rx="16" fill="#FFFFFF"/>
    <g transform="translate(42 441)" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round">
      <circle r="8"/>
      <path d="M0 -3 V0 M0 3 V3.5"/>
    </g>
    <text x="59" y="445" font-family="Arial" font-size="13" font-weight="600" fill="#27272A">À savoir</text>
    <text x="40" y="471" font-family="Arial" font-size="11" fill="#71717A">Les photos sont conservées sur l'appareil</text>
    <text x="40" y="487" font-family="Arial" font-size="11" fill="#71717A">et ne sont pas automatiquement supprimées.</text>

    <!-- Bottom navigation -->
    <rect x="0" y="768" width="390" height="76" fill="#FFFFFF"/>
    <line x1="0" y1="768" x2="390" y2="768" stroke="#E2E8F0"/>

    <!-- Galerie -->
    <g transform="translate(112 790)" fill="none" stroke="#77777A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-7" width="16" height="14" rx="2"/>
      <circle cx="0" cy="0" r="2.5"/>
    </g>
    <text x="112" y="814" text-anchor="middle" font-family="Arial" font-size="11" fill="#77777A">Galerie</text>

    <!-- Paramètres actif -->
    <g transform="translate(278 790)" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle r="3"/>
      <path d="M0 -9 V-6 M0 6 V9 M-9 0 H-6 M6 0 H9 M-6.5 -6.5 L-4.5 -4.5 M4.5 4.5 L6.5 6.5 M6.5 -6.5 L4.5 -4.5 M-4.5 4.5 L-6.5 6.5"/>
    </g>
    <text x="278" y="814" text-anchor="middle" font-family="Arial" font-size="11" font-weight="600" fill="#64748B">Paramètres</text>
  </g>
</svg>
