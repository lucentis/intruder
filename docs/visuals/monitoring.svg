
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>Intruder — Surveillance</title>
  <defs>
    <clipPath id="screen">
      <rect width="390" height="844" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="390" height="844" fill="#F8FAFC"/>

    <!-- En-tête -->
    <path d="M27 34 L19 42 L27 50" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="43" y="48" font-family="Arial" font-size="22" font-weight="600" fill="#27272A">Surveillance</text>

    <!-- Événements surveillés -->
    <rect x="16" y="78" width="358" height="184" rx="16" fill="#FFFFFF"/>
    <text x="30" y="104" font-family="Arial" font-size="13" font-weight="600" fill="#27272A">Événements surveillés</text>

    <!-- Déverrouillages réussis -->
    <rect x="29" y="120" width="38" height="38" rx="9" fill="#F1F5F9"/>
    <g transform="translate(48 139)" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-6" y="-8" width="12" height="16" rx="2"/>
      <path d="M-2 -3 L1 0 L4 -3"/>
    </g>

    <text x="77" y="133" font-family="Arial" font-size="12" font-weight="600" fill="#27272A">Déverrouillages réussis</text>
    <text x="77" y="149" font-family="Arial" font-size="10" fill="#71717A">Détecter les déverrouillages réussis du</text>
    <text x="77" y="162" font-family="Arial" font-size="10" fill="#71717A">téléphone.</text>

    <!-- Switch ON -->
    <rect x="319" y="127" width="38" height="22" rx="11" fill="#64748B"/>
    <circle cx="344" cy="138" r="7" fill="#FFFFFF"/>

    <line x1="30" y1="174" x2="360" y2="174" stroke="#E2E8F0"/>

    <!-- Codes PIN échoués -->
    <rect x="29" y="190" width="38" height="38" rx="9" fill="#F1F5F9"/>
    <g transform="translate(48 209)" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-6" y="-8" width="12" height="16" rx="2"/>
      <path d="M-2 -2 L2 2 M2 -2 L-2 2"/>
    </g>

    <text x="77" y="203" font-family="Arial" font-size="12" font-weight="600" fill="#27272A">Codes PIN échoués</text>
    <text x="77" y="219" font-family="Arial" font-size="10" fill="#71717A">Détecter les tentatives de déverrouillage</text>
    <text x="77" y="232" font-family="Arial" font-size="10" fill="#71717A">échouées.</text>

    <!-- Switch ON -->
    <rect x="319" y="197" width="38" height="22" rx="11" fill="#64748B"/>
    <circle cx="344" cy="208" r="7" fill="#FFFFFF"/>

    <!-- Information -->
    <rect x="16" y="278" width="358" height="86" rx="16" fill="#FFFFFF"/>
    <circle cx="39" cy="303" r="8" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <path d="M39 299 V304 M39 308 V308.5" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <text x="54" y="307" font-family="Arial" font-size="13" font-weight="600" fill="#27272A">À savoir</text>
    <text x="30" y="332" font-family="Arial" font-size="11" fill="#71717A">
      <tspan x="30" dy="0">Chaque type de surveillance peut être activé</tspan>
      <tspan x="30" dy="16">ou désactivé indépendamment.</tspan>
    </text>

    <!-- Navigation basse -->
    <rect x="0" y="768" width="390" height="76" fill="#FFFFFF"/>
    <line x1="0" y1="768" x2="390" y2="768" stroke="#E2E8F0"/>

    <!-- Galerie -->
    <g transform="translate(112 790)" fill="none" stroke="#77777A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-7" width="16" height="14" rx="2"/>
      <circle cx="0" cy="0" r="2.5"/>
    </g>
    <text x="112" y="814" text-anchor="middle" font-family="Arial" font-size="11" fill="#77777A">Galerie</text>

    <!-- Paramètres -->
    <g transform="translate(278 790)" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round">
      <circle r="3"/>
      <path d="M0 -9 V-6 M0 6 V9 M-9 0 H-6 M6 0 H9 M-6.5 -6.5 L-4.5 -4.5 M4.5 4.5 L6.5 6.5 M6.5 -6.5 L4.5 -4.5 M-4.5 4.5 L-6.5 6.5"/>
    </g>
    <text x="278" y="814" text-anchor="middle" font-family="Arial" font-size="11" font-weight="600" fill="#64748B">Paramètres</text>
  </g>
</svg>
