
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <clipPath id="screen"><rect width="390" height="844" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
    <rect width="390" height="844" fill="#F8FAFC"/>

    <!-- Header -->
    <g font-family="Arial, sans-serif">
      <path d="M31 57 L23 65 L31 73 M23 65 H39" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="71" font-size="21" font-weight="700" fill="#27272A">Capture photo</text>

      <!-- Automatic capture card -->
      <rect x="16" y="101" width="358" height="112" rx="16" fill="#FFFFFF"/>
      <rect x="30" y="128" width="44" height="44" rx="12" fill="#F1F5F9"/>
      <g transform="translate(52 150)" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-10 -5 H-5 L-2 -9 H5 L8 -5 H10 Q12 -5 12 -3 V7 Q12 9 10 9 H-10 Q-12 9 -12 7 V-3 Q-12 -5 -10 -5Z"/>
        <circle cx="0" cy="2" r="4"/>
      </g>
      <text x="88" y="145" font-size="14" font-weight="700" fill="#27272A">Capture automatique</text>
      <text x="88" y="164" font-size="11" fill="#71717A">Activer ou désactiver les captures photo.</text>
      <rect x="315" y="143" width="42" height="24" rx="12" fill="#64748B"/>
      <circle cx="345" cy="155" r="9" fill="#FFFFFF"/>

      <!-- Capture settings card -->
      <rect x="16" y="229" width="358" height="220" rx="16" fill="#FFFFFF"/>
      <text x="30" y="259" font-size="14" font-weight="700" fill="#27272A">Paramètres de capture</text>

      <!-- Camera row -->
      <rect x="30" y="278" width="38" height="38" rx="10" fill="#F1F5F9"/>
      <g transform="translate(49 297)" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-10 -5 H-5 L-2 -8 H5 L8 -5 H10 Q12 -5 12 -3 V6 Q12 8 10 8 H-10 Q-12 8 -12 6 V-3 Q-12 -5 -10 -5Z"/>
        <circle cx="0" cy="1" r="3.5"/>
      </g>
      <text x="80" y="294" font-size="13" font-weight="700" fill="#27272A">Caméra</text>
      <text x="80" y="311" font-size="10.5" fill="#71717A">Caméra utilisée pour les captures.</text>
      <text x="310" y="301" font-size="12" fill="#475569" text-anchor="end">Avant</text>
      <path d="M320 294 L325 299 L320 304" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      <path d="M30 332 H360" stroke="#E2E8F0"/>

      <!-- Quality row -->
      <rect x="30" y="350" width="38" height="38" rx="10" fill="#F1F5F9"/>
      <g transform="translate(49 369)" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-11" y="-8" width="22" height="16" rx="2"/>
        <circle cx="-4" cy="-3" r="1.5"/>
        <path d="M-9 5 L-3 -1 L1 3 L4 0 L9 5"/>
      </g>
      <text x="80" y="366" font-size="13" font-weight="700" fill="#27272A">Qualité photo</text>
      <text x="80" y="383" font-size="10.5" fill="#71717A">Niveau de qualité des photos capturées.</text>
      <text x="310" y="373" font-size="12" fill="#475569" text-anchor="end">Élevée</text>
      <path d="M320 366 L325 371 L320 376" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Information card -->
      <rect x="16" y="465" width="358" height="105" rx="16" fill="#FFFFFF"/>
      <circle cx="43" cy="493" r="9" fill="none" stroke="#64748B" stroke-width="1.4"/>
      <path d="M43 489 V489.5 M43 493 V498" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
      <text x="60" y="498" font-size="13" font-weight="700" fill="#27272A">À savoir</text>
      <text x="30" y="527" font-size="11" fill="#71717A">La capture photo est indépendante des réglages</text>
      <text x="30" y="544" font-size="11" fill="#71717A">de surveillance.</text>

      <!-- Bottom navigation -->
      <rect x="0" y="758" width="390" height="86" fill="#FFFFFF"/>
      <path d="M0 758 H390" stroke="#E2E8F0"/>

      <!-- Galerie -->
      <g transform="translate(112 790)" fill="none" stroke="#77777A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-8" y="-7" width="16" height="14" rx="2"/>
        <circle cx="0" cy="0" r="2.5"/>
      </g>
      <text x="112" y="814" text-anchor="middle" font-family="Arial" font-size="11" fill="#77777A">Galerie</text>

      <!-- Paramètres -->
      <g transform="translate(278 790)" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round">
        <circle r="3"/>
        <path d="M0 -9 V-6 M0 6 V9 M-9 0 H-6 M6 0 H9 M-6.5 -6.5 L-4.5 -4.5 M4.5 4.5 L6.5 6.5 M6.5 -6.5 L4.5 -4.5 M-4.5 4.5 L-6.5 6.5"/>
      </g>
      <text x="278" y="814" text-anchor="middle" font-family="Arial" font-size="11" font-weight="600" fill="#64748B">Paramètres</text>
    </g>
  </g>
</svg>
